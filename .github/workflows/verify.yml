name: verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check index.js
        run: node --check index.js
      - name: Syntax check client.js
        run: node --check client.js
      - name: Fake-host integration tests
        run: node tests/fake-host.mjs
